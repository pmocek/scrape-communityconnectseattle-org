name: Scrape

on:
  push:
  workflow_dispatch:
  schedule:
  # Daily at 6:23 AM UTC
  - cron: '23 6 * * *'
  # For hourly at 42 minutes past the hour: '42 * * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.is_template }}
    steps:
    - uses: actions/checkout@v6
    - name: Create scrape.sh if it doesn't exist
      run: |
        if [ ! -f "scrape.sh" ]; then
          echo '#!/bin/bash' > scrape.sh
          if [[ "$REPO_DESC" == http://* ]] || [[ "$REPO_DESC" == https://* ]]; then
            echo "./download.sh '$REPO_DESC'" >> scrape.sh
          else
            echo "# ./download.sh 'https://www.example.com/'" >> scrape.sh
          fi
          chmod +x scrape.sh
          echo "Created scrape.sh"
          # And replace README.md
          echo -e "# Scheduled scraper\n\nFor $REPO_DESC" > README.md 
        fi
      env:
        REPO_DESC: ${{ github.event.repository.description }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright/
        key: ${{ runner.os }}-browsers
    - name: Install Playwright browser
      run: |
        uvx shot-scraper install
    - name: Run the scraper
      run: |
        ./scrape.sh
    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "Nothing changed — no commit"
          exit 0
        fi
        MSG=$(python3 scripts/describe-diff.py)
        if [ -z "$MSG" ]; then
          MSG="data: periodic check (no count changes)"
        fi
        git commit -m "$MSG"
        git pull --rebase
        git push

